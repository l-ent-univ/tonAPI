[package]
name = "tonapi-server"
description = "Serveur HTTP de tonAPI : routes /v1, OpenAPI, documentation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
arc-swap = "1.9.2"
axum = "0.8.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
notify = "8.2.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["full"] }
tonapi-config.workspace = true
tonapi-core.workspace = true
tonapi-providers.workspace = true
tonapi-session.workspace = true
tonapi-metrics.workspace = true
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "tonapi-server"
path = "src/main.rs"
