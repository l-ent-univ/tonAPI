#:schema ../../schema/university.schema.json
# Université `{id}`. Seuls `id`, `name` et `[sso]` sont obligatoires ; un service absent n'est pas proposé.
# Remplacez chaque « <à remplir> » et chaque `a-remplir.invalid`, puis lancez `tonapi validate`.
# Liste des fournisseurs et de leurs paramètres : `tonapi providers`.

id = "{id}"
name = "<à remplir>"
# short-name = "UX"
status = "beta"            # active une fois testée avec un vrai compte

# [links]
# website = "https://www.exemple.fr/"
# password-reset = "https://compte.exemple.fr/motdepasse"

[sso]
kind = "cas"
base-url = "https://a-remplir.invalid/cas/"   # racine du CAS, sans /login
# flavor = "apereo"        # apereo (défaut) | esup-otp-gateway | phpcas
