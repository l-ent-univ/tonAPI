[package]
name = "tonapi-providers"
description = "Fournisseurs de données de tonAPI : un module par logiciel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
reqwest = { version = "0.13.5", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tonapi-config.workspace = true
tonapi-core.workspace = true
tonapi-http.workspace = true
tonapi-session.workspace = true
tracing = "0.1.44"
url.workspace = true
# Messagerie (`src/mail`) : catégories Unicode (`\p{L}`, `\p{Cn}`…) et NFC/NFKD, comme le
# JavaScript de Tafac dont les règles sont reprises.
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
percent-encoding = "2.3.2"
# Délais de la connexion au webmail et de la lecture d'un envoi (`zimbra/webmail.rs`).
tokio = { version = "1.54.1", features = ["time"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
