name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # À faire : épingler les actions par SHA de commit.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Même version que rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Fichiers d'universités valides
        run: cargo run --locked -q -p tonapi-cli -- validate universities
      - name: JSON Schema à jour
        run: cargo run --locked -q -p tonapi-cli -- schema --check
      - name: Rapports sans donnée personnelle
        run: cargo run --locked -q -p tonapi-cli -- report check reports/*.md

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      # À faire : épingler les actions par SHA de commit.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Construction seule : l'image n'est poussée nulle part.
      - name: Image du serveur
        run: DOCKER_BUILDKIT=1 docker build --tag tonapi:ci .
      - name: L'image démarre et répond sur /readyz
        run: |
          key=$(docker run --rm --entrypoint tonapi tonapi:ci keygen ci | grep -o 'ci:[^ ]*' | head -1)
          docker run -d --name tonapi -p 8080:8080 -e TONAPI_SESSION_KEYS="$key" tonapi:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readyz && exit 0
            sleep 1
          done
          docker logs tonapi
          exit 1
