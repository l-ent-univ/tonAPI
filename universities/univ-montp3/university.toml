#:schema ../../schema/university.schema.json
# Université Paul-Valéry Montpellier 3. Sources : docs/rapports/univ-montp3.md (observations du 27/10/2026).

id = "univ-montp3"
name = "Université Paul-Valéry Montpellier 3"
short-name = "UPV"
status = "beta"

[links]
website = "https://www.univ-montp3.fr/"

# [vu] formulaire Apereo CAS (`execution`, `username`, `password`), sans passerelle /pre-otp/.
# Second facteur : [inconnu].
[sso]
kind = "cas"
base-url = "https://cas.univ-montp3.fr/cas/"

# [vu] uPortal : `api/v4-3/dlm/layout.json` répond, `api/v5-1/userinfo` répond 404 et
# `layout.jsp` aussi (pas de ProlongationENT). Les applications passent par la variante uPortal 5,
# qui lit le même layout ; le profil vient de `session.json` et `people`.
[portal]
kind = "uportal5"
base-url = "https://monupv.univ-montp3.fr/uPortal/"

# [vu] ADE MyPlanning 6.15 (GWT) derrière le CAS ; ressources de l'étudiant lues par GWT-RPC,
# flux public `anonymous_cal.jsp` (projet 1). Observé le 27/10/2026.
[services.timetable]
provider = "ade-myplanning"
base-url = "https://mon-planning.univ-montp3.fr/"

# [vu] application de scolarité (Angular) derrière le CAS, `api/etudiants/notes`. Format des
# semestres lu dans le client public [code] ; aucun relevé réel observé (compte sans note).
[services.grades]
provider = "etudiants-api"
base-url = "https://scolarite.univ-montp3.fr/"

# Calendrier des épreuves : même application que les notes (`api/etudiants/calendrier`).
[services.exams]
provider = "etudiants-api"
base-url = "https://scolarite.univ-montp3.fr/"

# [vu] Moodle : entrée `login/index.php?authCAS=CAS`, retour sur /my/ avec `sesskey`.
[services.homework]
provider = "moodle-ajax"
base-url = "https://moodle.univ-montp3.fr/"

# [vu] BlueMind 5.7.5 : `mail.etu.univ-montp3.fr` redirige vers `mail.etu.umpv.fr`, connexion
# par le CAS puis API REST. Observé le 27/10/2026.
[services.mail]
provider = "bluemind"
base-url = "https://mail.etu.umpv.fr/"

[services.apps]
provider = "portal"

# [vu] `api/session.json` et `api/people/<id>.json` (le portail n'a pas `v5-1/userinfo`),
# complétés par le numéro étudiant et la formation de l'application de scolarité
# (`api/etudiants/notes`).
[services.profile]
provider = "portal"
record = { kind = "etudiants-api", base-url = "https://scolarite.univ-montp3.fr/" }

# [vu] portlet « Certificat de scolarité ».
# Attestations semestrielles, annuelles et de réussite de l'application de scolarité ; le
# certificat de scolarité reste une page de l'ENT (portlet `etuCertifScola`).
[services.documents]
provider = "etudiants-api"
base-url = "https://scolarite.univ-montp3.fr/"
certificate-url = "https://app.univ-montp3.fr/ent/Certificat"
