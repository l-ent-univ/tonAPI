#:schema ../../schema/university.schema.json
# Université de Montpellier. Sources : Docs/Montpellier/.

id = "umontpellier"
name = "Université de Montpellier"
short-name = "UM"
status = "beta"

[links]
website = "https://www.umontpellier.fr/"
account-help = "https://app.umontpellier.fr/securum/protected/authenticated"
password-reset = "https://app.umontpellier.fr/securum/public/centralAuthentication"

# esup-otp-cas-server (/cas) devant Apereo CAS 7 (/pre-otp). Docs/Montpellier/cas-umontpellier.md
[sso]
kind = "cas"
base-url = "https://cas.umontpellier.fr/cas/"
flavor = "esup-otp-gateway"

[sso.mfa]
api-url = "https://otp-api.umontpellier.fr/"

# uPortal 4.3.1 + ESUP ProlongationENT. Docs/Montpellier/ent.md
[portal]
kind = "uportal4-prolongation"
base-url = "https://ent.umontpellier.fr/uPortal/"

# Lien iCal ADE lu sur prose-etudiant. Docs/Montpellier/emploi-du-temps.md, lien-ade.md
[services.timetable]
provider = "ade-ical-link"
link-page = "https://app.umontpellier.fr/prose-etudiant/protected/ical"
feed-host = "proseconsult.umontpellier.fr"
options = { cache-ttl-secs = 900 }

# Les facultés n'ont pas de ScoDoc : relevés certifiés seulement. Docs/Montpellier/ent.md
[services.grades]
provider = "link"
url = "https://app.umontpellier.fr/rn_demat/protected/student-result"
label = "Relevés de notes"

# Moodle UM : web service mobile désactivé, AJAX avec sesskey. Docs/Montpellier/ent.md
[services.homework]
provider = "moodle-ajax"
base-url = "https://moodle.umontpellier.fr/"
entry = "cas"

# Zimbra, préauthentification CAS. Le second facteur est souvent demandé ici.
[services.mail]
provider = "zimbra-rest"
base-url = "https://mail.etu.umontpellier.fr/"
entry-url = "https://mail.etu.umontpellier.fr/public/preauthetu.jsp"

[services.apps]
provider = "portal"

[services.profile]
provider = "portal"

# Attestations dématérialisées. Docs/Montpellier/research/pistes-api.md
[services.documents]
provider = "ardemat"
base-url = "https://app.umontpellier.fr/ardemat-api/"
