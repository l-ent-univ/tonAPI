#:schema ../../schema/university.schema.json
# Université de Montpellier. Sources : docs/recherche/montpellier/.

id = "umontpellier"
name = "Université de Montpellier"
short-name = "UM"
status = "beta"

[links]
website = "https://www.umontpellier.fr/"
account-help = "https://app.umontpellier.fr/securum/protected/authenticated"
password-reset = "https://app.umontpellier.fr/securum/public/centralAuthentication"

# esup-otp-cas-server (/cas) devant Apereo CAS 7 (/pre-otp). docs/recherche/montpellier/cas-umontpellier.md
[sso]
kind = "cas"
base-url = "https://cas.umontpellier.fr/cas/"
flavor = "esup-otp-gateway"

[sso.mfa]
api-url = "https://otp-api.umontpellier.fr/"
# Le CAS exige le second facteur pour le mail seulement ([vu] 13/10/2026 et 09/11/2026) :
# la connexion ouvre l'entrée du mail pour le demander tout de suite.
step-up-url = "https://mail.etu.umontpellier.fr/public/preauthetu.jsp"

# Nouvel ENT, en service depuis octobre 2026 : portail à tuiles avec son client CAS, à la place d'uPortal.
# [vu] pages publiques : api/config, entrée cas/login?next=/, service cas/callback.
[portal]
kind = "tiles-portal"
base-url = "https://ent.umontpellier.fr/"

# Lien iCal ADE lu sur prose-etudiant. docs/recherche/montpellier/emploi-du-temps.md, lien-ade.md
[services.timetable]
provider = "ade-ical-link"
link-page = "https://app.umontpellier.fr/prose-etudiant/protected/ical"
feed-host = "proseconsult.umontpellier.fr"
options = { cache-ttl-secs = 900 }

# Les facultés n'ont pas de ScoDoc : relevés certifiés seulement. docs/recherche/montpellier/ent.md
[services.grades]
provider = "link"
url = "https://app.umontpellier.fr/rn_demat/protected/student-result"
label = "Relevés de notes"

# Moodle UM : web service mobile désactivé, AJAX avec sesskey. docs/recherche/montpellier/ent.md
[services.homework]
provider = "moodle-ajax"
base-url = "https://moodle.umontpellier.fr/"

# Zimbra, préauthentification CAS. Le second facteur est souvent demandé ici.
[services.mail]
provider = "zimbra-rest"
base-url = "https://mail.etu.umontpellier.fr/"
entry-url = "https://mail.etu.umontpellier.fr/public/preauthetu.jsp"

[services.apps]
provider = "portal"

[services.profile]
provider = "portal"

# Attestations de réussite dématérialisées. [vu] 13/10/2026 (Swagger public, front Angular) et
# 28/10/2026 (service CAS de l'application). docs/recherche/montpellier/notes/pistes-api.md §6.3
[services.documents]
provider = "ardemat"
base-url = "https://app.umontpellier.fr/ardemat-api/"
service-url = "https://app.umontpellier.fr/ardemat/"
