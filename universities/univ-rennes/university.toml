#:schema ../../schema/university.schema.json
# Université de Rennes. Sources : docs/recherche/rennes/.

id = "univ-rennes"
name = "Université de Rennes"
short-name = "UR"
status = "beta"

[links]
website = "https://www.univ-rennes.fr/"
account-help = "https://sesame.univ-rennes.fr/comptes/"
password-reset = "https://docinfo.univ-rennes1.fr/documentation/compte-jai-oublie-mon-mot-de-passe"
account-activation = "https://sesame.univ-rennes1.fr/motdepasse/public/activate"

# Apereo CAS 7. Second facteur esup-otp pour certains comptes seulement. docs/recherche/rennes/cas-rennes.md
[sso]
kind = "cas"
base-url = "https://sso-cas.univ-rennes.fr/"

[sso.mfa]
api-url = "https://mfa-api.univ-rennes.fr/"

# Moodle et Partage passent par la fédération RENATER : SP → WAYF → IdP → CAS.
[sso.saml]
wayf-url = "https://wayf.univ-rennes.fr/"
idp-entity-id = "urn:mace:cru.fr:federation:univ-rennes1.fr"
allowed-hosts = ["univ-rennes.fr", "univ-rennes1.fr", "renater.fr"]

# uPortal 5 servi à la racine. docs/recherche/rennes/apis/uportal5.md
[portal]
kind = "uportal5"
base-url = "https://services-numeriques.univ-rennes.fr/"

# Pas de flux iCal public : API REST du portail ADE. docs/recherche/rennes/apis/ade-portal-rest.md
[services.timetable]
provider = "ade-portal-rest"
base-url = "https://planning.univ-rennes.fr/portal/"

# Moodle 4.4 (foad), connexion Shibboleth, AJAX avec sesskey. docs/recherche/rennes/moodle.md
[services.homework]
provider = "moodle-ajax"
base-url = "https://foad.univ-rennes.fr/"
entry = "shibboleth"

# RENATER Partage (Zimbra). docs/recherche/rennes/mail-et-autres.md
[services.mail]
provider = "zimbra-rest"
base-url = "https://partage.univ-rennes1.fr/"
entry-url = "https://partage.univ-rennes.fr/"

[services.apps]
provider = "portal"

[services.profile]
provider = "portal"

# Certificat de scolarité, onglet Inscriptions. docs/recherche/rennes/ent.md
[services.documents]
provider = "mon-dossier-web"
base-url = "https://mdw.univ-rennes.fr/"
