#:schema ../../../schema/establishment.schema.json
# IUT de Lannion. Sources : docs/recherche/rennes/scodoc.md, docs/recherche/rennes/emploi-du-temps.md.

id = "iut-lannion"
name = "IUT de Lannion"
status = "beta"

# Arbre du portail ADE : le chemin du groupe commence par `IUT Lannion`. [vu] 15/11/2026, un
# compte étudiant de l'IUT : composante détectée à la connexion.
[[affiliation.rules]]
signal = "ade-group-path"
contains = "IUT Lannion"
weight = 3

# Passerelle ScoDoc derrière le CAS de l'université.
[services.grades]
provider = "scodoc-gateway"
base-url = "https://notes9.iutlan.univ-rennes1.fr/"

# [déduit] champs d'absences supposés identiques à Béziers.
[services.absences]
provider = "scodoc-gateway"
base-url = "https://notes9.iutlan.univ-rennes1.fr/"
