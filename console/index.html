<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src https: http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'">
<title>Banc d'essai · tonAPI</title>
<link rel="stylesheet" href="style.css?v=22">
<script src="theme.js?v=22"></script>
</head>
<body>
<a class="skip" href="#view" id="skip">Aller au contenu</a>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <strong>tonAPI</strong>
      <span>Banc d'essai</span>
    </div>
    <!-- Icônes dessinées pour chaque page : signal (essai), personne (comptes), tableau
         (couverture), prise (fournisseurs), accolades (API), triangle (erreurs). -->
    <nav class="nav" aria-label="Pages">
      <a href="#/" data-page=""><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h3l2-5 3 10 2-5h3"/></svg>Banc d'essai</a>
      <a href="#/comptes" data-page="comptes"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.7"/><path d="M2.8 14c.6-2.8 2.7-4.2 5.2-4.2s4.6 1.4 5.2 4.2"/></svg>Comptes <small id="count-accounts">0</small></a>
      <a href="#/couverture" data-page="couverture"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M2 10h12M6 2.5v11"/></svg>Couverture</a>
      <a href="#/fournisseurs" data-page="fournisseurs"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 1.5v3M10 1.5v3M4 4.5h8v3a4 4 0 0 1-8 0zM8 11.5v3"/></svg>Fournisseurs</a>
      <a href="#/api" data-page="api"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 2.5c-1.5 0-2 .7-2 2v1.6c0 .9-.6 1.6-1.5 1.9.9.3 1.5 1 1.5 1.9v1.6c0 1.3.5 2 2 2M10.5 2.5c1.5 0 2 .7 2 2v1.6c0 .9.6 1.6 1.5 1.9-.9.3-1.5 1-1.5 1.9v1.6c0 1.3-.5 2-2 2"/></svg>Explorateur d'API</a>
      <a href="#/erreurs" data-page="erreurs"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 1.8 13h12.4z M8 6.5v3 M8 11.3v.2"/></svg>Codes d'erreur</a>
    </nav>
    <div class="rail-push"></div>
    <div class="rail-block">
      <div class="health" id="health" aria-live="polite"><span class="dot"></span>Vérification…</div>
    </div>
    <div class="rail-block session-block">
      <span class="rail-label">Session</span>
      <div id="active-account"></div>
    </div>
    <details class="settings" id="settings" open>
      <summary>Réglages<svg class="icon chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></summary>
      <div class="settings-body">
        <div class="rail-block">
          <label class="rail-label" for="api">Adresse de l'API</label>
          <input id="api" type="url" spellcheck="false" autocomplete="off">
        </div>
        <div class="rail-block">
          <span class="rail-label" id="theme-label">Thème</span>
          <div class="segmented theme" role="group" aria-labelledby="theme-label">
            <button type="button" data-theme="auto">Auto</button>
            <button type="button" data-theme="light">Clair</button>
            <button type="button" data-theme="dark">Sombre</button>
          </div>
        </div>
      </div>
    </details>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<script src="donnees.js?v=22"></script>
<script src="app.js?v=22"></script>
</body>
</html>
